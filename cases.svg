  </g>

  <g class="row" style="animation-delay:4s">
    <line x1="40" x2="1160" y1="466" y2="466" stroke="#232229"/>
    <text x="56" y="494" fill="#6F6C78" style="font-size:13px"><tspan fill="#E8B04B">●</tspan> produção = dados reais de clientes, demo em call   <tspan fill="#4ADE80">●</tspan> 200 OK = aberto para visitar</text>
