name: snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#9D8CFF&color_dots=#15151A,#2E2856,#4B3F99,#7465D6,#9D8CFF
            dist/snake-light.svg?color_snake=#6B5BD6&color_dots=#EBEDF0,#D9D3FF,#B3A8FF,#8C7DF0,#6B5BD6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
